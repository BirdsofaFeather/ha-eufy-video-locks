name: Check source and repair guards
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/prepare-test-sdk.sh
      - run: node tests/test-repairs.mjs
      - run: node tests/test_identity_capture.mjs
      - run: python tests/test-integration.py
      - run: python scripts/audit-package.py
      - run: python scripts/audit-git-privacy.py
