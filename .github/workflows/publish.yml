name: Build and publish installable app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/prepare-test-sdk.sh
      - run: node tests/test-repairs.mjs
      - run: python tests/test-integration.py
      - run: python scripts/audit-package.py
      - name: Read release version
        id: release
        shell: bash
        run: |
          version=$(python -c 'import json; print(json.load(open("custom_components/eufy_video_locks/manifest.json"))["version"])')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Release tag must match the app/integration version'; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: eufy_video_locks
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/birdsofafeather/ha-eufy-video-locks:${{ steps.release.outputs.version }}
          build-args: BUILD_VERSION=${{ steps.release.outputs.version }}
          provenance: true
